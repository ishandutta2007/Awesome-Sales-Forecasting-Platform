<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#neonGrad);
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .tag-badge {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes waveMove {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .animated-dash {
      stroke-dasharray: 8, 6;
      animation: dashMove 2.5s linear infinite;
    }
    .pulsing-dot {
      animation: pulseGlow 2s ease-in-out infinite;
      transform-origin: 1060px 180px;
    }
    .wave-line {
      animation: waveMove 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="400" fill="none" stroke="#334155" stroke-width="1.5" rx="16" opacity="0.6"/>

  <!-- Background Grid -->
  <g opacity="0.12">
    <line x1="100" y1="60" x2="1140" y2="60" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="100" y1="130" x2="1140" y2="130" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="100" y1="200" x2="1140" y2="200" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="100" y1="270" x2="1140" y2="270" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="100" y1="340" x2="1140" y2="340" stroke="#94a3b8" stroke-dasharray="4,4"/>
    
    <line x1="200" y1="40" x2="200" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="400" y1="40" x2="400" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="600" y1="40" x2="600" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="800" y1="40" x2="800" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="1000" y1="40" x2="1000" y2="360" stroke="#94a3b8" stroke-dasharray="4,4"/>
  </g>

  <!-- Decorative Forecast Chart Silhouette on Right -->
  <g class="wave-line" opacity="0.85">
    <!-- Area fill under forecast curve -->
    <path d="M 680 320 L 740 280 L 810 290 L 880 230 L 950 250 L 1010 190 L 1080 150 L 1120 160 L 1120 340 L 680 340 Z" fill="url(#areaGrad)"/>
    
    <!-- Historical Solid Line -->
    <path d="M 680 320 L 740 280 L 810 290 L 880 230 L 950 250 L 1010 190" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- AI Forecast Projection Dashed Line -->
    <path class="animated-dash" d="M 1010 190 L 1080 150 L 1120 160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Data Nodes -->
    <circle cx="680" cy="320" r="5" fill="#06b6d4" filter="url(#subtleGlow)"/>
    <circle cx="740" cy="280" r="5" fill="#0ea5e9" filter="url(#subtleGlow)"/>
    <circle cx="810" cy="290" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="880" cy="230" r="5" fill="#6366f1" filter="url(#subtleGlow)"/>
    <circle cx="950" cy="250" r="5" fill="#818cf8" filter="url(#subtleGlow)"/>
    <circle cx="1010" cy="190" r="6" fill="#a855f7" filter="url(#subtleGlow)"/>
    
    <!-- Target Forecast Node Pulsing -->
    <circle class="pulsing-dot" cx="1080" cy="150" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="1080" cy="150" r="3" fill="#ffffff"/>
  </g>

  <!-- Forecast Confidence Cone -->
  <polygon points="1010,190 1120,110 1120,210" fill="#38bdf8" opacity="0.12"/>
  <line x1="1010" y1="190" x2="1120" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="1010" y1="190" x2="1120" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Left Content Info -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" class="tag-badge">AI REVENUE INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text">Awesome Sales Forecasting</text>
    <text x="0" y="215" class="title-text" fill="#f8fafc">&amp; Revenue Intelligence</text>

    <!-- Subtitle -->
    <text x="0" y="268" class="sub-text">PIPELINE INSPECTION  •  DEAL RISK  •  COMMIT ACCURACY</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🤖 AI Predictions</text>

      <rect x="145" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="157" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#818cf8">📊 Pipeline Rollups</text>

      <rect x="300" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="312" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">⚡ Open-Source ML</text>
      
      <rect x="465" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="477" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">💼 Top SaaS</text>
    </g>
  </g>
</svg>
